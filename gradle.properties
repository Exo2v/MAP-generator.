# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment properties.  The Minecraft version must agree with the NeoForge version.
# Latest builds: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.176
neo_version_range=[21.1.0,21.2)
loader_version_range=[4,)

## Mod properties
mod_id=vantraya_builder
mod_name=Vantraya Builder
# The jar is named <mod_file_name>-neoforge-<minecraft_version>-<mod_version>.jar, e.g. vantraya-builder-neoforge-1.21.1-0.1.0.jar
mod_file_name=vantraya-builder
mod_license=All Rights Reserved
mod_version=0.2.0
mod_group_id=io.github.exo2v.vantraya
mod_authors=Exo2v
mod_description=Builds the continent of Vantyra (Ashenfall) live, from its specification, when a world is created with the "Vantraya" world type.\nLandmarks, elevations, climate tiers and the slope-aware surface table come from the Ashenfall master specification; Lithosphere, Still Life and Tectonic can run alongside it.
