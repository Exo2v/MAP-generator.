name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Write access is for one thing only: the last step commits the finished jar to builds/ (see builds/README.md).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # compiles against NeoForge 1.21.1, runs the specification tests (landmark pins, Java-vs-Python parity, the
      # noise-router checks) and the in-engine tests (the world type loaded and driven by the real game on an
      # in-memory server - no dedicated server, no EULA), and assembles the mod jar
      - name: Build and test
        timeout-minutes: 14
        run: |
          set -o pipefail
          # Watchdog: a build still running after 9 minutes is stuck (it normally takes 4-5). Dump the threads of the
          # test JVM so the cause can be read afterwards.
          (
            sleep 540
            for pid in $(pgrep -f 'Gradle Test Executor' || true); do
              jstack "$pid" > "/tmp/threads-$pid.txt" 2>&1 || true
            done
          ) &
          ./gradlew build --no-daemon 2>&1 | tee build.log

      # A green tick alone does not say how many tests ran, so count them per suite (and say so on the run's summary).
      # Every failed or skipped test also gets an annotation of its own with its message: the logs and test reports
      # cannot be downloaded from outside GitHub, and one shared annotation is cut at 4096 characters.
      - name: Count the tests that ran
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          def esc(s, prop=False):
              s = s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              return s.replace(':', '%3A').replace(',', '%2C') if prop else s

          total = failures = errors = skipped = 0
          lines = []
          problems = []
          for path in sorted(glob.glob('build/test-results/test/*.xml')):
              suite = ET.parse(path).getroot()
              n, f, e, k = (int(suite.get(a, 0)) for a in ('tests', 'failures', 'errors', 'skipped'))
              total += n
              failures += f
              errors += e
              skipped += k
              lines.append(f"{suite.get('name').rsplit('.', 1)[-1]}: {n}" + (f" ({f} failed, {e} errors)" if f or e else "") + (f" ({k} skipped)" if k else ""))
              for case in suite.iter('testcase'):
                  name = f"{case.get('classname', '').rsplit('.', 1)[-1]}.{case.get('name')}"
                  for kind in ('failure', 'error'):
                      for el in case.findall(kind):
                          frames = [l.strip() for l in (el.text or '').splitlines() if 'vantraya' in l][:4]
                          problems.append(('error', name, (el.get('message') or el.get('type') or '?') + '\n' + '\n'.join(frames)))
                  for el in case.findall('skipped'):
                      problems.append(('warning', 'skipped: ' + name, el.get('message') or 'no reason given'))
          print(f"::notice title=Tests::{total} tests ran: {failures} failures, {errors} errors, {skipped} skipped - " + "; ".join(lines))
          for level, title, detail in problems[:9]:
              print(f"::{level} title={esc(title, True)}::{esc(detail[:3500])}")
          if total == 0:
              print("::error title=Tests::no test results were found - the tests did not run")
              raise SystemExit(1)
          PY

      # What the jar must contain for the world type to exist in game: the Minecraft-facing classes, the preset and
      # dimension type JSON, and mod metadata with every ${placeholder} expanded. Also: nothing from the sources may be
      # missing from it, and builds/ must hold this very jar (the Gradle build copies it there after the tests).
      - name: Check the jar contents
        id: jar
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          echo "jar: $jar"
          echo "name=$(basename "$jar" .jar)" >> "$GITHUB_OUTPUT"
          unzip -l "$jar" > /tmp/jar.txt
          unzip -Z1 "$jar" | sort > /tmp/in-jar.txt
          unzip -p "$jar" META-INF/neoforge.mods.toml > /tmp/mods.toml
          if ! grep -q 'vantraya_builder.mixins.json' /tmp/mods.toml; then
            echo "::error title=Jar::neoforge.mods.toml does not register the mixin config"
            exit 1
          fi
          if grep -q '\${' /tmp/mods.toml; then
            echo "::error title=Jar::neoforge.mods.toml still contains an unexpanded placeholder"
            grep -n '\${' /tmp/mods.toml
            exit 1
          fi
          for entry in \
              io/github/exo2v/vantraya/VantrayaBuilder.class \
              io/github/exo2v/vantraya/mc/VantrayaChunkGenerator.class \
              io/github/exo2v/vantraya/mc/VantrayaBiomeSource.class \
              io/github/exo2v/vantraya/mc/VantrayaField.class \
              io/github/exo2v/vantraya/mc/WorldTypePriority.class \
              io/github/exo2v/vantraya/mixin/WorldDimensionsMixin.class \
              vantraya_builder.mixins.json \
              data/vantraya_builder/worldgen/world_preset/vantraya.json \
              data/vantraya_builder/dimension_type/vantraya.json \
              data/vantraya_builder/worldgen/noise_settings/vantraya.json \
              data/vantraya_builder/worldgen/density_function/base_3d_noise.json \
              data/minecraft/tags/worldgen/world_preset/normal.json; do
            if ! grep -q "$entry" /tmp/jar.txt; then
              echo "::error title=Jar::missing from the jar: $entry"
              exit 1
            fi
          done
          # every resource file and every compiled class of the sources must be in the jar
          { (cd src/main/resources && find . -type f -printf '%P\n'); (cd build/classes/java/main && find . -type f -name '*.class' -printf '%P\n'); } | sort > /tmp/expected.txt
          missing=$(comm -23 /tmp/expected.txt /tmp/in-jar.txt)
          if [ -n "$missing" ]; then
            echo "::error title=Jar::in the sources but missing from the jar: $(echo "$missing" | head -n 5 | tr '\n' ' ')"
            exit 1
          fi
          # builds/ must hold exactly this jar, and only this one
          if ! cmp -s "$jar" "builds/$(basename "$jar")"; then
            echo "::error title=builds/::builds/ does not hold the jar that was just built"
            ls -la builds
            exit 1
          fi
          if [ "$(ls builds/*.jar | wc -l)" != 1 ]; then
            echo "::error title=builds/::builds/ must hold exactly one jar"
            ls -la builds
            exit 1
          fi
          echo "::notice title=Jar::$(basename "$jar"): $(tail -n 1 /tmp/jar.txt | xargs); metadata expanded, all $(wc -l < /tmp/expected.txt) classes and resource files present, identical to builds/"

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.name }}
          path: build/libs/*.jar
          if-no-files-found: error

      # Last step of a build that passed everything above: commit the jar to builds/, so that it can be picked up from
      # the repository itself (the logs and artifacts of a run cannot be downloaded from every network). The archive
      # is reproducible, so a rebuild of unchanged sources gives the identical jar and there is nothing to commit.
      # A push made with the workflow's own token never starts another run.
      - name: Commit the jar to builds/
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A newer commit may have landed while this build ran. If it changed anything but builds/, the run for it
          # publishes a jar of the newer sources - committing this older jar now could overwrite that one.
          if git fetch -q origin "${GITHUB_REF_NAME}"; then
            if ! newer=$(git diff --name-only "${GITHUB_SHA}" "origin/${GITHUB_REF_NAME}" -- . ':(exclude)builds'); then
              echo "::warning title=builds/::could not compare this build with the branch tip, so it is not published"
              exit 0
            fi
            if [ -n "$newer" ]; then
              echo "::notice title=builds/::the branch has moved on to newer sources ($(echo "$newer" | head -n 3 | tr '\n' ' ')) - the run for them publishes its jar"
              exit 0
            fi
          fi
          git add --all builds
          if git diff --cached --quiet; then
            echo "builds/ already holds exactly this jar - nothing to commit"
            exit 0
          fi
          git commit -q \
            -m "builds: $(basename "$jar")" \
            -m "Built by CI from ${GITHUB_SHA} (run ${GITHUB_RUN_ID}) after every test passed. SHA-256 $(sha256sum "$jar" | cut -d' ' -f1)." \
            -m "[skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              echo "::notice title=builds/::committed $(basename "$jar") to ${GITHUB_REF_NAME}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}): the branch has moved, rebasing onto its new tip"
            git fetch -q origin "${GITHUB_REF_NAME}"
            git rebase -q "origin/${GITHUB_REF_NAME}"
          done
          echo "::error title=builds/::could not push the jar to ${GITHUB_REF_NAME}"
          exit 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
          if-no-files-found: ignore

      # When the build fails, put the reasons where they can be read without opening the full log: one annotation on
      # the run. GitHub keeps only the first 4096 characters of an annotation, so every section has its own budget
      # and none can crowd out the others.
      - name: Explain a failed build
        if: failure()
        run: |
          section() { echo "== $1 =="; head -c "$2"; echo; }
          {
            grep -E -A5 ' FAILED$' build.log | cut -c1-170 | section "failed tests" 1200
            grep -E -A7 'Encountered an unexpected exception|Exception in server tick loop|Failed to load vanilla datapack|Failed to start the minecraft server|Failed to initialize server|Registry loading errors|Mixin apply|MixinApplyError|InjectionError|Critical injection failure|Mixin transformation' build.log | cut -c1-170 | section "the game's own errors" 1100
            grep -E -A2 'error:|What went wrong|Execution failed|Could not (resolve|find)' build.log | cut -c1-170 | section "compiler / gradle" 500
            for f in /tmp/threads-*.txt; do
              [ -f "$f" ] || continue
              {
                awk '/^"/ { keep = ($0 ~ /^"Server thread"/) ? 20 : 0; n = 0 } keep > 0 && n < keep { print; n++ }' "$f"
                awk '/^"/ { keep = ($0 ~ /^"Test worker"/) ? 5 : 0; n = 0 } keep > 0 && n < keep { print; n++ }' "$f"
              } | cut -c1-170 | section "a test JVM was stuck: the server thread (absent = it had ended), then the test thread" 1000
            done
            tail -n 10 build.log | cut -c1-170 | section "end of the build log" 400
          } | tr -d '\r' | head -c 3950 | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }' > /tmp/why.txt
          echo "::error title=Why the build failed::$(cat /tmp/why.txt)"
