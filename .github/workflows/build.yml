name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # compiles against NeoForge 1.21.1, runs the specification tests (landmark pins, Java-vs-Python parity, the
      # noise-router checks) and assembles the mod jar
      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: vantraya_builder
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
          if-no-files-found: ignore
