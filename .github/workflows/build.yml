name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # compiles against NeoForge 1.21.1, runs the specification tests (landmark pins, Java-vs-Python parity, the
      # noise-router checks) and the in-engine tests (the world type loaded and driven by the real game on an
      # in-memory server - no dedicated server, no EULA), and assembles the mod jar
      - name: Build and test
        timeout-minutes: 14
        run: |
          set -o pipefail
          # Watchdog: a build still running after 9 minutes is stuck (it normally takes 4-5). Dump the threads of the
          # test JVM so the cause can be read afterwards.
          (
            sleep 540
            for pid in $(pgrep -f 'Gradle Test Executor' || true); do
              jstack "$pid" > "/tmp/threads-$pid.txt" 2>&1 || true
            done
          ) &
          ./gradlew build --no-daemon 2>&1 | tee build.log

      # A green tick alone does not say how many tests ran, so count them per suite (and say so on the run's summary).
      # Every failed or skipped test also gets an annotation of its own with its message: the logs and test reports
      # cannot be downloaded from outside GitHub, and one shared annotation is cut at 4096 characters.
      - name: Count the tests that ran
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          def esc(s, prop=False):
              s = s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              return s.replace(':', '%3A').replace(',', '%2C') if prop else s

          total = failures = errors = skipped = 0
          lines = []
          problems = []
          for path in sorted(glob.glob('build/test-results/test/*.xml')):
              suite = ET.parse(path).getroot()
              n, f, e, k = (int(suite.get(a, 0)) for a in ('tests', 'failures', 'errors', 'skipped'))
              total += n
              failures += f
              errors += e
              skipped += k
              lines.append(f"{suite.get('name').rsplit('.', 1)[-1]}: {n}" + (f" ({f} failed, {e} errors)" if f or e else "") + (f" ({k} skipped)" if k else ""))
              for case in suite.iter('testcase'):
                  name = f"{case.get('classname', '').rsplit('.', 1)[-1]}.{case.get('name')}"
                  for kind in ('failure', 'error'):
                      for el in case.findall(kind):
                          frames = [l.strip() for l in (el.text or '').splitlines() if 'vantraya' in l][:4]
                          problems.append(('error', name, (el.get('message') or el.get('type') or '?') + '\n' + '\n'.join(frames)))
                  for el in case.findall('skipped'):
                      problems.append(('warning', 'skipped: ' + name, el.get('message') or 'no reason given'))
          print(f"::notice title=Tests::{total} tests ran: {failures} failures, {errors} errors, {skipped} skipped - " + "; ".join(lines))
          for level, title, detail in problems[:9]:
              print(f"::{level} title={esc(title, True)}::{esc(detail[:3500])}")
          if total == 0:
              print("::error title=Tests::no test results were found - the tests did not run")
              raise SystemExit(1)
          PY

      # What the jar must contain for the world type to exist in game: the Minecraft-facing classes, the preset and
      # dimension type JSON, and mod metadata with every ${placeholder} expanded.
      - name: Check the jar contents
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          echo "jar: $jar"
          unzip -l "$jar" > /tmp/jar.txt
          unzip -p "$jar" META-INF/neoforge.mods.toml > /tmp/mods.toml
          if grep -q '\${' /tmp/mods.toml; then
            echo "::error title=Jar::neoforge.mods.toml still contains an unexpanded placeholder"
            grep -n '\${' /tmp/mods.toml
            exit 1
          fi
          for entry in \
              io/github/exo2v/vantraya/VantrayaBuilder.class \
              io/github/exo2v/vantraya/mc/VantrayaChunkGenerator.class \
              io/github/exo2v/vantraya/mc/VantrayaBiomeSource.class \
              io/github/exo2v/vantraya/mc/VantrayaField.class \
              data/vantraya_builder/worldgen/world_preset/vantraya.json \
              data/vantraya_builder/dimension_type/vantraya.json \
              data/vantraya_builder/worldgen/noise_settings/vantraya.json \
              data/vantraya_builder/worldgen/density_function/base_3d_noise.json \
              data/minecraft/tags/worldgen/world_preset/normal.json; do
            if ! grep -q "$entry" /tmp/jar.txt; then
              echo "::error title=Jar::missing from the jar: $entry"
              exit 1
            fi
          done
          echo "::notice title=Jar::$(basename "$jar"): $(tail -n 1 /tmp/jar.txt | xargs); metadata expanded, classes and data present"

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: vantraya_builder
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
          if-no-files-found: ignore

      # When the build fails, put the reasons where they can be read without opening the full log: one annotation on
      # the run. GitHub keeps only the first 4096 characters of an annotation, so every section has its own budget
      # and none can crowd out the others.
      - name: Explain a failed build
        if: failure()
        run: |
          section() { echo "== $1 =="; head -c "$2"; echo; }
          {
            grep -E -A5 ' FAILED$' build.log | cut -c1-170 | section "failed tests" 1200
            grep -E -A7 'Encountered an unexpected exception|Exception in server tick loop|Failed to load vanilla datapack|Failed to start the minecraft server|Failed to initialize server|Registry loading errors' build.log | cut -c1-170 | section "the game's own errors" 1100
            grep -E -A2 'error:|What went wrong|Execution failed|Could not (resolve|find)' build.log | cut -c1-170 | section "compiler / gradle" 500
            for f in /tmp/threads-*.txt; do
              [ -f "$f" ] || continue
              {
                awk '/^"/ { keep = ($0 ~ /^"Server thread"/) ? 20 : 0; n = 0 } keep > 0 && n < keep { print; n++ }' "$f"
                awk '/^"/ { keep = ($0 ~ /^"Test worker"/) ? 5 : 0; n = 0 } keep > 0 && n < keep { print; n++ }' "$f"
              } | cut -c1-170 | section "a test JVM was stuck: the server thread (absent = it had ended), then the test thread" 1000
            done
            tail -n 10 build.log | cut -c1-170 | section "end of the build log" 400
          } | tr -d '\r' | head -c 3950 | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }' > /tmp/why.txt
          echo "::error title=Why the build failed::$(cat /tmp/why.txt)"
