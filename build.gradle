plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.91'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

// The jar is named after the mod, the loader and the Minecraft version it is for, then the mod's own version:
// vantraya-builder-neoforge-1.21.1-0.1.0.jar
base {
    archivesName = "${mod_file_name}-neoforge-${minecraft_version}"
}

// Building the same sources twice gives the same bytes (no timestamps, fixed file order). That is what lets CI
// tell whether builds/ already holds the jar of the current sources, and lets anyone check a jar against the
// sources it claims to come from.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors
        )
    }
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    // Access Transformers are picked up automatically from META-INF/accesstransformer.cfg
    // (this mod does not need any: it only uses public Minecraft API).

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Runs the tests inside a real NeoForge / Minecraft environment (registries, codecs, an in-memory server that
    // loads the mod's data through Minecraft's own loader). See src/test/java/.../engine.
    unitTest {
        enable()
        testedMod = mods.getByName(project.mod_id)
    }
}

// Include resources generated by data generators (none yet, kept for convention).
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // The pure-Java specification model (io.github.exo2v.vantraya.core) has no Minecraft dependency; its unit
    // tests are plain JUnit 4 and run through the Vintage engine below.
    testImplementation 'junit:junit:4.13.2'
    // RouterTest evaluates the generated noise-router JSON; Minecraft ships this same Gson version
    testImplementation 'com.google.code.gson:gson:2.10.1'

    // The in-engine tests (JUnit 5): the world type loaded by Minecraft's own data loader, the Climate/biome
    // machinery, and real chunk generation. EphemeralTestServerProvider starts an in-memory server without any
    // world on disk and without the dedicated server's EULA step.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
    testImplementation "net.neoforged:testframework:${project.neo_version}"
}

test {
    useJUnitPlatform()
    // The model tests sample thousands of points and the in-memory server loads all of vanilla's data.
    maxHeapSize = '2g'
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        // In CI the game's log goes into the build log, where the workflow can quote the first error.
        showStandardStreams = System.getenv('CI') != null
    }
}

// Expands ${...} placeholders in the mod metadata template.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// builds/ holds the finished mod, ready to be copied into a mods/ folder (build/ is a scratch directory that is not
// kept). The copy happens only after every check has passed, so a jar that failed its tests never lands there, and
// it replaces the previous jar: two versions of one mod in mods/ stop the game from starting.
tasks.register('publishBuild', Sync) {
    group = 'build'
    description = 'Copies the jar into builds/ once all the tests have passed'
    dependsOn 'check'
    from tasks.named('jar')
    into 'builds'
    preserve {
        // hand-written, not a build product
        include 'README.md'
    }
}
tasks.named('build') {
    dependsOn 'publishBuild'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
